[package]
name = "ostra-desktop"
version = "0.1.0"
description = "Ostra: every inbox, one place."
authors = ["Ostra"]
license = "AGPL-3.0-only"
edition = "2021"
rust-version = "1.80"

[lib]
name = "ostra_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-opener = "2.7"
tauri-plugin-sql = { version = "2.6", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
